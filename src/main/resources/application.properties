spring.application.name=portfolio-pilot
# Render injects PORT; local default stays 8080.
server.port=${PORT:8080}

# --- TiDB (MySQL-compatible) ---
# Credentials via env vars in real use. Defaults below are your current
# TiDB Cloud cluster so Increment 1 runs out of the box.
# SECURITY: rotate this password later — it was previously stored in plaintext.
spring.datasource.url=${TIDB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/portfolio_pilot?sslMode=VERIFY_IDENTITY&serverTimezone=UTC}
spring.datasource.username=${TIDB_USER:Qez4fp4NTpC9LtZ.root}
spring.datasource.password=${TIDB_PASSWORD:BfwkMMNha8oxXYmX}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hikari vs TiDB Cloud: server closes idle connections, so recycle
# ours first (maxLifetime < server wait_timeout) and keep them warm. ---
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

# --- JPA/Hibernate (learning mode: auto-sync schema from entities) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (wired in Increment 2: auth) ---
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-that-is-at-least-64-characters-long-for-hs512-algorithm-use-me-only-locally}
app.jwt.expiration-ms=86400000

# --- Public base URL (verification/reset links; never localhost in prod) ---
app.base-url=${APP_BASE_URL:http://localhost:5173}

# --- Mail (SMTP via env; absent config = registration stays pending, 503 on send) ---
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.from=${APP_MAIL_FROM:Portfolio Pilot <no-reply@example.com>}
app.mail.verification-ttl-hours=24
app.mail.reset-ttl-minutes=60

# --- Auth hardening ---
# Local-dev ONLY: include the raw verification token in register/resend
# responses so the flow is testable without SMTP. NEVER true in prod.
app.auth.dev-mode=${APP_AUTH_DEV_MODE:false}

# --- Admin bootstrap (env only; never committed). Blank password = skipped. ---
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# --- Google OAuth: credentials ONLY via GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET
# env vars (see OAuthClientConfig). Absent = OAuth disabled, app boots password-only. ---
